<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ZUMDA - Online Menyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --kfc-red: #E4002B;
            --bg-gray: #F8F8F8;
            --text-dark: #202124;
            --border: #EDEDED;
        }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: var(--text-dark); margin: 0; }

        /* Layout */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .top-bar {
            height: 80px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 40px;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 260px;
            border-right: 1px solid var(--border);
            background: #fff;
            overflow-y: auto;
            padding: 20px 0;
        }
        .side-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #5F6368;
            transition: 0.2s;
        }
        .side-item:hover { background: #f1f3f4; color: var(--text-dark); }
        .side-item.active {
            background: #FCE4EC;
            color: var(--kfc-red);
            border-radius: 0 25px 25px 0;
            margin-right: 15px;
            font-weight: 700;
        }

        /* Content Area */
        .content-area { flex: 1; overflow-y: auto; background: #fff; padding: 40px; }

        /* Search */
        .search-container {
            max-width: 400px;
            margin-bottom: 30px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 25px;
            background: var(--bg-gray);
            border: 1px solid transparent;
            outline: none;
            transition: 0.2s;
        }
        .search-input:focus { background: #fff; border-color: var(--kfc-red); }

        /* Section Title */
        .section-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--text-dark);
        }

        /* Food Card */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }
        .food-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            transition: 0.3s;
            position: relative;
        }
        .food-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

        .food-img-container { width: 130px; height: 130px; flex-shrink: 0; }
        .food-img { width: 100%; height: 100%; object-fit: contain; }
        .food-info { display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
        .food-name { font-weight: 800; font-size: 16px; text-transform: uppercase; margin-bottom: 5px; }
        .food-desc { font-size: 12px; color: #808080; line-height: 1.4; margin-bottom: 10px; }
        .price-btn { background: var(--kfc-red); color: #fff; padding: 10px 25px; border-radius: 25px; font-weight: 800; font-size: 14px; display: inline-block; align-self: flex-start; cursor: pointer; transition: 0.2s; }

        #loading-screen { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .logo-kfc { font-weight: 900; color: var(--kfc-red); font-size: 32px; border: 3px solid var(--kfc-red); padding: 5px 15px; margin-right: 30px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .food-grid { grid-template-columns: 1fr; }
            .food-card { flex-direction: column; align-items: center; text-align: center; }
            .price-btn { align-self: center; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h1 class="text-red-600 text-4xl font-black animate-bounce">ZUMDA</h1>
    </div>

    <div class="app-container">
        <header class="top-bar">
            <div class="logo-kfc">ZUMDA</div>
            <nav class="hidden md:flex gap-4">
                <button class="px-6 py-2 bg-red-600 text-white rounded-full font-bold text-sm">MENYU</button>
                <a id="location-link" href="#" target="_blank" class="px-6 py-2 bg-gray-100 rounded-full font-bold text-sm flex items-center gap-2 hover:bg-gray-200 transition-colors">
                    RESTORANLAR (LOKATSIYA)
                </a>
                <button class="px-6 py-2 border-2 border-green-600 text-green-600 rounded-full font-bold text-xs flex items-center gap-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>
                    HALAL
                </button>
            </nav>
            <div class="ml-auto flex items-center gap-6">
                <div class="flex gap-4">
                    <a id="phone-link" href="#">
                        <svg class="w-6 h-6 text-gray-400 cursor-pointer hover:text-red-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    </a>
                    <svg class="w-6 h-6 text-gray-400 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div id="side-cats"></div>
            </aside>
            <main class="content-area">
                <div class="search-container">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="search-input" placeholder="Izlash..." class="search-input" oninput="renderMenu()">
                </div>
                <h2 id="current-cat-title" class="section-title">Hammasi</h2>
                <div id="food-grid" class="food-grid"></div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCzEWcQgUByxmqcSeANHg2CXyIbxrlnX0",
            authDomain: "oqtosh-menu.firebaseapp.com",
            databaseURL: "https://oqtosh-menu-default-rtdb.firebaseio.com",
            projectId: "oqtosh-menu",
            storageBucket: "oqtosh-menu.firebasestorage.app",
            messagingSenderId: "419490536594",
            appId: "1:419490536594:web:5d08d63deef125c4861a4b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'menyuData');

        window.data = { categories: [], menuItems: [] };
        let activeCategory = "Hammasi";

        onValue(dbRef, (snapshot) => {
            const fbData = snapshot.val();
            if (fbData) {
                window.data = fbData;
                renderAll();
            }
            document.getElementById('loading-screen').style.display = 'none';
        });

        function renderAll() {
            renderCategories();
            renderMenu();
            // Telefon va Lokatsiya linklarini yangilash
            if(window.data.phone) {
                document.getElementById('phone-link').href = `tel:${window.data.phone.replace(/[^0-9+]/g, '')}`;
            }
            if(window.data.address) {
                document.getElementById('location-link').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(window.data.address)}`;
            }
        }

        function renderCategories() {
            const container = document.getElementById('side-cats');
            let html = `<div onclick="setCategory('Hammasi')" class="side-item ${activeCategory === 'Hammasi' ? 'active' : ''}">Hammasi</div>`;
            (window.data.categories || []).forEach(cat => {
                html += `<div onclick="setCategory('${cat}')" class="side-item ${activeCategory === cat ? 'active' : ''}">${cat}</div>`;
            });
            container.innerHTML = html;
        }

        window.setCategory = (cat) => {
            activeCategory = cat;
            document.getElementById('current-cat-title').innerText = cat;
            renderMenu();
            renderCategories();
        };

        window.renderMenu = () => {
            const search = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('food-grid');
            let filtered = (window.data.menuItems || []).filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesCat = activeCategory === "Hammasi" || item.category === activeCategory;
                return matchesSearch && matchesCat;
            });

            container.innerHTML = filtered.map(item => `
                <div class="food-card">
                    <div class="food-img-container"><img src="${item.image}" class="food-img"></div>
                    <div class="food-info">
                        <div>
                            <h3 class="food-name">${item.name}</h3>
                            <p class="food-desc">${item.description || 'Mazali taomlarimizdan biri.'}</p>
                        </div>
                        <div class="price-btn">${item.price} UZS</div>
                    </div>
                </div>
            `).join('');
        };
    </script>
</body>
</html>
